<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Vinyl Control</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-icon">♫</div>
    <p class="eyebrow">GESTÃO DE ACERVO</p>
    <h1>Vinyl Control</h1>
    <p class="muted">Entre para gerenciar sua coleção.</p>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="admin@vinyl.com" required autocomplete="username">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required autocomplete="current-password">
      <p id="mensagem" class="mensagem" role="alert"></p>
      <button class="btn btn-primary btn-full" type="submit">Entrar no sistema</button>
    </form>
    <p class="login-help">Acesso de demonstração disponível no README.</p>
  </main>
</body>
</html>
